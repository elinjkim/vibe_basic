<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 추석행사 운영관리</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
    background: #f7f8fa;
    color: #222;
}

button, input, select, textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 230px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    padding: 25px 16px;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
}

.logo {
    padding: 0 12px 25px;
    border-bottom: 1px solid #eee;
    margin-bottom: 18px;
}

.logo-title {
    font-size: 18px;
    font-weight: 800;
}

.logo-sub {
    font-size: 12px;
    color: #888;
    margin-top: 5px;
}

.menu-title {
    font-size: 11px;
    color: #999;
    font-weight: 700;
    margin: 18px 12px 8px;
}

.menu button {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 11px 12px;
    border-radius: 8px;
    text-align: left;
    font-size: 14px;
    color: #555;
    margin-bottom: 3px;
}

.menu button:hover {
    background: #f4f4f5;
}

.menu button.active {
    background: #111827;
    color: white;
    font-weight: 700;
}

/* =========================
   MAIN
========================= */

.main {
    margin-left: 230px;
    width: calc(100% - 230px);
}

.topbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
}

.page-title {
    font-size: 21px;
    font-weight: 800;
}

.admin-badge {
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 20px;
    background: #f3f4f6;
    color: #555;
}

.content {
    padding: 30px 35px 60px;
    max-width: 1400px;
}

/* =========================
   DASHBOARD
========================= */

.welcome {
    margin-bottom: 25px;
}

.welcome h1 {
    margin: 0 0 7px;
    font-size: 26px;
}

.welcome p {
    color: #777;
    margin: 0;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
}

.stat-label {
    color: #777;
    font-size: 13px;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
    margin-top: 8px;
}

.stat-sub {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 22px;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.panel-title {
    font-size: 16px;
    font-weight: 800;
}

.list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #f0f0f0;
}

.list-item:last-child {
    border-bottom: none;
}

.item-left {
    display: flex;
    gap: 12px;
    align-items: center;
}

.date-box {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #f4f4f5;
    text-align: center;
    padding-top: 7px;
}

.date-month {
    font-size: 10px;
    color: #888;
}

.date-day {
    font-size: 18px;
    font-weight: 800;
}

.item-title {
    font-size: 14px;
    font-weight: 700;
}

.item-sub {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
}

.status {
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
    background: #f3f4f6;
    color: #555;
}

.status.done {
    background: #ecfdf5;
    color: #047857;
}

.status.progress {
    background: #eff6ff;
    color: #2563eb;
}

/* =========================
   SECTION
========================= */

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section-header h2 {
    margin: 0;
    font-size: 21px;
}

.section-description {
    color: #777;
    font-size: 13px;
    margin-top: 6px;
}

.primary-btn {
    border: none;
    background: #111827;
    color: white;
    padding: 10px 15px;
    border-radius: 7px;
    font-weight: 700;
}

.primary-btn:hover {
    background: #000;
}

.secondary-btn {
    border: 1px solid #ddd;
    background: white;
    padding: 9px 14px;
    border-radius: 7px;
}

.danger-btn {
    border: none;
    background: #fff1f2;
    color: #be123c;
    padding: 7px 10px;
    border-radius: 6px;
}

/* =========================
   MISSION CARDS
========================= */

.mission-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.mission-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 20px;
}

.mission-icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.mission-name {
    font-size: 17px;
    font-weight: 800;
}

.mission-manager {
    font-size: 12px;
    color: #777;
    margin-top: 7px;
}

.progress-bar {
    height: 6px;
    background: #eee;
    border-radius: 10px;
    margin: 15px 0 8px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #111827;
}

.progress-text {
    font-size: 11px;
    color: #777;
}

.mission-actions {
    margin-top: 15px;
    display: flex;
    gap: 7px;
}

/* =========================
   TABLE
========================= */

.table-wrap {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f8f9fa;
    font-size: 12px;
    color: #777;
    text-align: left;
    padding: 13px 15px;
    border-bottom: 1px solid #e5e7eb;
}

td {
    padding: 13px 15px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 13px;
}

tr:last-child td {
    border-bottom: none;
}

/* =========================
   FILTER
========================= */

.filters {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

input, select, textarea {
    border: 1px solid #dfe1e5;
    border-radius: 7px;
    padding: 9px 11px;
    background: white;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #999;
}

/* =========================
   CHECKLIST
========================= */

.check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.check-item input {
    width: 17px;
    height: 17px;
}

.check-item.completed span {
    text-decoration: line-through;
    color: #aaa;
}

/* =========================
   MODAL
========================= */

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.35);
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    background: white;
    width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 12px;
    padding: 25px;
}

.modal h3 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

/* =========================
   BUDGET
========================= */

.budget-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.budget-box {
    background: white;
    border: 1px solid #e5e7eb;
    padding: 18px;
    border-radius: 10px;
}

.budget-box .label {
    font-size: 12px;
    color: #888;
}

.budget-box .value {
    font-size: 21px;
    font-weight: 800;
    margin-top: 6px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 900px) {
    .sidebar {
        width: 190px;
    }

    .main {
        margin-left: 190px;
        width: calc(100% - 190px);
    }

    .stats,
    .budget-summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .mission-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

function showPage(page, btn){

    document.querySelectorAll(".menu button").forEach(b=>{
        b.classList.remove("active");
    });

    // 대시보드의 '전체 보기' 버튼으로 이동한 경우에도
    // 해당 메뉴에 활성화 표시가 되도록 처리
    if(!btn){

        const menuMap = {
            dashboard: "대시보드",
            schedule: "일정관리",
            missions: "미션부스",
            culture: "문화체험",
            supplies: "준비물",
            tasks: "해야 할 일",
            budget: "예산관리",
            staff: "담당자"
        };

        const targetText = menuMap[page];

        document.querySelectorAll(".menu button").forEach(button=>{

            if(button.innerText.includes(targetText)){
                btn = button;
            }

        });

    }

    if(btn) btn.classList.add("active");

    const titles = {
        dashboard:"대시보드",
        schedule:"일정관리",
        missions:"미션부스",
        culture:"문화체험",
        supplies:"준비물 관리",
        tasks:"해야 할 일",
        budget:"예산관리",
        staff:"담당자 관리"
    };

    document.getElementById("pageTitle").innerText = titles[page];

    const content = document.getElementById("content");

    if(page==="dashboard") renderDashboard();
    if(page==="schedule") renderSchedule();
    if(page==="missions") renderMissions();
    if(page==="culture") renderCulture();
    if(page==="supplies") renderSupplies();
    if(page==="tasks") renderTasks();
    if(page==="budget") renderBudget();
    if(page==="staff") renderStaff();
}

                    <button class="secondary-btn" onclick="showPage('schedule')">전체 보기</button>

                    <button class="secondary-btn" onclick="showPage('tasks')">전체 보기</button>

function openScheduleModal(){

    openModal(`

        <h3>일정 추가</h3>

        <div class="form-group">
            <label>날짜</label>
            <input type="date" id="scheduleDate">
        </div>

        <div class="form-group">
            <label>일정명</label>
            <input id="scheduleTitle" placeholder="예: 미션카드 인쇄">
        </div>

        <div class="form-group">
            <label>담당자</label>
            <input id="scheduleManager" placeholder="담당자 이름">
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" onclick="closeModal()">취소</button>
            <button class="primary-btn" onclick="addSchedule()">저장</button>
        </div>
    `);
}

function addSchedule(){

    const date=document.getElementById("scheduleDate").value;
    const title=document.getElementById("scheduleTitle").value;
    const manager=document.getElementById("scheduleManager").value;

    if(!date || !title){
        alert("날짜와 일정명을 입력해주세요.");
        return;
    }

    schedules.push({
        id:Date.now(),
        date,
        title,
        manager:manager||"미정",
        status:"예정"
    });

    saveAll();
    closeModal();
    renderSchedule();
}

function changeScheduleStatus(id,value){
    const item=schedules.find(x=>x.id===id);
    if(item){
        item.status=value;
        saveAll();
    }
}

function deleteSchedule(id){
    if(confirm("이 일정을 삭제할까요?")){
        schedules=schedules.filter(x=>x.id!==id);
        saveAll();
        renderSchedule();
    }
}

/* ---------------------------------------------------------
   1. GAS 웹앱 주소
--------------------------------------------------------- */

const DAL_TOKKI_GAS_URL =
    "https://script.google.com/macros/s/AKfycbx0AKtHeQtXWJ_kuhAejDkGiBol896LfW1zYBqA8nsFU9KPUFzmnW1keN35YiPD5cSS/exec";


/* ---------------------------------------------------------
   2. GAS GET 요청 공통 함수
--------------------------------------------------------- */

async function dalTokkiGasGet(action, params = {}) {

    try {

        const query = new URLSearchParams();

        query.append("action", action);

        Object.keys(params).forEach(function(key) {

            if (
                params[key] !== undefined &&
                params[key] !== null
            ) {

                query.append(
                    key,
                    params[key]
                );

            }

        });


        const response = await fetch(
            DAL_TOKKI_GAS_URL +
            "?" +
            query.toString()
        );


        if (!response.ok) {

            throw new Error(
                "GAS 서버 응답 오류: " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "🌕 달토끼 GAS GET:",
            data
        );


        return data;


    } catch (error) {

        console.error(
            "❌ GAS GET 연결 오류:",
            error
        );


        return {

            success: false,

            message:
                "Google Sheets 연결에 실패했습니다."

        };

    }

}


/* ---------------------------------------------------------
   3. GAS POST 요청 공통 함수
--------------------------------------------------------- */

async function dalTokkiGasPost(data) {

    try {

        const response = await fetch(
            DAL_TOKKI_GAS_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(data)

            }
        );


        if (!response.ok) {

            throw new Error(
                "GAS 서버 응답 오류: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "🌕 달토끼 GAS POST:",
            result
        );


        return result;


    } catch (error) {

        console.error(
            "❌ GAS POST 연결 오류:",
            error
        );


        return {

            success: false,

            message:
                "Google Sheets 저장에 실패했습니다."

        };

    }

}
