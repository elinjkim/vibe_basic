<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jieun — A Moment of Light</title>

  <style>
    /* =====================================================
       기본 설정
    ====================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Georgia", "Times New Roman", serif;
      color: rgba(255, 248, 255, 0.95);
      background: #3b275e;
    }


    /* =====================================================
       전체 화면
    ====================================================== */

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      /*
        보라빛 하늘
      */
      background:
        radial-gradient(
          circle at 78% 66%,
          rgba(255, 211, 146, 0.9) 0%,
          rgba(255, 164, 191, 0.45) 9%,
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #39276a 0%,
          #654b92 30%,
          #b978a7 55%,
          #e99caa 72%,
          #f4b988 100%
        );
    }


    /* =====================================================
       구름
    ====================================================== */

    .cloud {
      position: absolute;
      border-radius: 50%;
      filter: blur(35px);
      opacity: 0.18;
      pointer-events: none;
    }

    .cloud.one {
      width: 420px;
      height: 120px;
      top: 16%;
      left: -80px;
      background: #f7c9e6;
      transform: rotate(-8deg);
    }

    .cloud.two {
      width: 500px;
      height: 130px;
      top: 30%;
      right: -130px;
      background: #ffb9cf;
      transform: rotate(10deg);
    }

    .cloud.three {
      width: 380px;
      height: 100px;
      top: 48%;
      left: 25%;
      background: #ffd4dd;
      opacity: 0.13;
    }


    /* =====================================================
       먼 산 실루엣
    ====================================================== */

    .mountains {
      position: absolute;
      bottom: 25%;
      left: 0;
      width: 100%;
      height: 20%;
      opacity: 0.35;
    }

    .mountain {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-left: 180px solid transparent;
      border-right: 180px solid transparent;
      border-bottom: 150px solid #493a72;
    }

    .mountain:nth-child(1) {
      left: 2%;
      transform: scale(1.3);
    }

    .mountain:nth-child(2) {
      left: 25%;
      transform: scale(1.8);
    }

    .mountain:nth-child(3) {
      left: 55%;
      transform: scale(1.4);
    }

    .mountain:nth-child(4) {
      right: -5%;
      transform: scale(1.7);
    }


    /* =====================================================
       태양
    ====================================================== */

    .sun {
      position: absolute;
      width: 105px;
      height: 105px;
      border-radius: 50%;

      right: 12%;
      bottom: 29%;

      background:
        radial-gradient(
          circle,
          #fffce9 0%,
          #ffe8ad 28%,
          #ffc879 55%,
          rgba(255, 170, 100, 0.3) 70%,
          transparent 72%
        );

      box-shadow:
        0 0 35px #ffd28b,
        0 0 90px rgba(255, 189, 120, 0.7),
        0 0 180px rgba(255, 160, 110, 0.35);

      animation: sunGlow 4s ease-in-out infinite;
    }

    @keyframes sunGlow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }


    /* =====================================================
       수영장 / 물
    ====================================================== */

    .pool {
      position: absolute;
      left: -5%;
      bottom: -5%;
      width: 110%;
      height: 34%;

      background:
        linear-gradient(
          180deg,
          rgba(102, 87, 150, 0.8),
          rgba(54, 54, 103, 0.95)
        );

      border-radius: 50% 50% 0 0 / 15% 15% 0 0;

      box-shadow:
        inset 0 20px 40px rgba(255, 190, 210, 0.15);
    }


    /*
      물결
    */

    .water-lines {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0.3;
    }

    .wave {
      position: absolute;
      height: 1px;
      width: 180px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 218, 230, 0.8),
        transparent
      );

      animation: waveMove linear infinite;
    }

    @keyframes waveMove {
      from {
        transform: translateX(-250px);
      }

      to {
        transform: translateX(110vw);
      }
    }


    /* =====================================================
       햇빛이 물에 반사되는 길
    ====================================================== */

    .sun-reflection {
      position: absolute;

      right: 8%;
      bottom: 4%;

      width: 160px;
      height: 300px;

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(255, 220, 151, 0.25),
          rgba(255, 220, 151, 0.08),
          transparent
        );

      filter: blur(8px);

      transform: perspective(300px) rotateX(55deg);

      opacity: 0.7;

      animation: reflection 2.5s ease-in-out infinite;
    }

    @keyframes reflection {
      0%, 100% {
        opacity: 0.45;
      }

      50% {
        opacity: 0.9;
      }
    }


    /* =====================================================
       별 / 햇빛 반짝임
    ====================================================== */

    .sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 8px white,
        0 0 20px rgba(255, 232, 183, 0.9);

      animation: sparkle 2.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0.2);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* =====================================================
       중앙 콘텐츠
    ====================================================== */

    .content {
      position: absolute;
      z-index: 10;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 90%;
      text-align: center;

      animation: appear 2s ease-out forwards;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translate(-50%, -46%);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }


    /* =====================================================
       이름
    ====================================================== */

    .name {
      font-family: "Brush Script MT", "Segoe Script", cursive;

      font-size: clamp(80px, 14vw, 190px);
      font-weight: 400;
      font-style: italic;

      letter-spacing: -8px;

      color: rgba(255, 248, 255, 0.95);

      text-shadow:
        0 0 10px rgba(255,255,255,0.8),
        0 0 35px rgba(255, 211, 239, 0.5),
        0 8px 40px rgba(54, 25, 80, 0.25);

      animation: nameGlow 5s ease-in-out infinite;
    }

    @keyframes nameGlow {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(255,255,255,0.7),
          0 0 35px rgba(255, 211, 239, 0.45);
      }

      50% {
        text-shadow:
          0 0 15px rgba(255,255,255,1),
          0 0 55px rgba(255, 222, 246, 0.8);
      }
    }


    /* =====================================================
       서정적인 문장
    ====================================================== */

    .quote {
      margin-top: 20px;

      font-family:
        "Noto Serif KR",
        "Batang",
        "Times New Roman",
        serif;

      font-size: clamp(14px, 1.8vw, 22px);

      font-weight: 300;

      letter-spacing: 0.25em;

      color: rgba(255, 248, 248, 0.9);

      text-shadow:
        0 1px 15px rgba(60, 30, 80, 0.35);
    }


    /* =====================================================
       구분선
    ====================================================== */

    .line {
      width: 100px;
      height: 1px;

      margin: 28px auto;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.8),
        transparent
      );
    }


    /* =====================================================
       Scroll
    ====================================================== */

    .scroll {
      position: absolute;

      z-index: 20;

      bottom: 35px;
      left: 50%;

      transform: translateX(-50%);

      font-size: 11px;
      letter-spacing: 0.4em;

      color: rgba(255,255,255,0.75);

      animation: scrollFloat 2.5s ease-in-out infinite;
    }

    .scroll::after {
      content: "";

      display: block;

      width: 1px;
      height: 45px;

      margin: 13px auto 0;

      background: linear-gradient(
        rgba(255,255,255,0.8),
        transparent
      );
    }

    @keyframes scrollFloat {
      0%, 100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, 8px);
      }
    }


    /* =====================================================
       모바일
    ====================================================== */

    @media (max-width: 600px) {

      .sun {
        right: 8%;
        bottom: 30%;
        width: 75px;
        height: 75px;
      }

      .pool {
        height: 32%;
      }

      .name {
        letter-spacing: -4px;
      }

      .quote {
        letter-spacing: 0.12em;
        line-height: 1.8;
      }
    }
  </style>
</head>


<body>

  <main class="hero">

    <!-- 하늘의 구름 -->
    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>


    <!-- 산 -->
    <div class="mountains">
      <div class="mountain"></div>
      <div class="mountain"></div>
      <div class="mountain"></div>
      <div class="mountain"></div>
    </div>


    <!-- 태양 -->
    <div class="sun"></div>


    <!-- 수영장 -->
    <div class="pool">

      <div class="sun-reflection"></div>

      <div class="water-lines" id="waterLines"></div>

    </div>


    <!-- 중앙 -->
    <section class="content">

      <h1 class="name">Jieun</h1>

      <div class="line"></div>

      <p class="quote">
        나는 오늘, 가장 빛나는 순간을 살아가고 있어
      </p>

    </section>


    <!-- 스크롤 -->
    <div class="scroll">
      SCROLL
    </div>

  </main>


  <script>
    /*
      ======================================================
      햇빛이 물 위에서 반짝이는 효과
      ======================================================
    */

    const hero = document.querySelector(".hero");

    /*
      랜덤한 반짝임 만들기
    */

    function createSparkle() {

      const sparkle = document.createElement("div");

      sparkle.classList.add("sparkle");

      /*
        화면의 위치를 랜덤으로 지정
      */

      sparkle.style.left =
        Math.random() * 100 + "%";

      sparkle.style.top =
        25 + Math.random() * 65 + "%";

      /*
        크기
      */

      const size =
        2 + Math.random() * 5;

      sparkle.style.width = size + "px";
      sparkle.style.height = size + "px";

      /*
        애니메이션 속도와 딜레이
      */

      sparkle.style.animationDuration =
        1.5 + Math.random() * 3 + "s";

      sparkle.style.animationDelay =
        Math.random() * 2 + "s";

      hero.appendChild(sparkle);


      /*
        일정 시간이 지나면 삭제
        → 계속 생성해도 브라우저가 무거워지지 않도록 함
      */

      setTimeout(() => {
        sparkle.remove();
      }, 6000);
    }


    /*
      계속해서 반짝임 생성
    */

    setInterval(createSparkle, 250);


    /*
      ======================================================
      수영장 물결 생성
      ======================================================
    */

    const waterLines =
      document.getElementById("waterLines");


    for (let i = 0; i < 22; i++) {

      const wave =
        document.createElement("div");

      wave.classList.add("wave");

      wave.style.top =
        Math.random() * 100 + "%";

      wave.style.left =
        Math.random() * 100 + "%";

      wave.style.width =
        80 + Math.random() * 200 + "px";

      wave.style.animationDuration =
        4 + Math.random() * 7 + "s";

      wave.style.animationDelay =
        Math.random() * 5 + "s";

      waterLines.appendChild(wave);
    }


    /*
      ======================================================
      마우스를 움직이면 아주 살짝 빛이 따라오는 효과
      ======================================================
    */

    document.addEventListener("mousemove", (event) => {

      const x =
        (event.clientX / window.innerWidth - 0.5) * 20;

      const y =
        (event.clientY / window.innerHeight - 0.5) * 20;

      const content =
        document.querySelector(".content");

      content.style.transform =
        `translate(calc(-50% + ${x / 5}px),
                   calc(-50% + ${y / 5}px))`;
    });

  </script>

</body>
</html>
