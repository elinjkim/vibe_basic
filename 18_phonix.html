<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>아이스크림 공장 알파벳 파닉스</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: #fce4ec;
    }

    /* 설정 화면 */
    #start-screen {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h1 {
      color: #ff4081;
      margin-bottom: 20px;
      font-size: 28px;
    }
    .setting-group {
      margin: 20px 0;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    select, input[type="range"] {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 2px solid #ff80ab;
      font-size: 16px;
      outline: none;
    }
    .btn {
      background: #ff4081;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
      margin-top: 10px;
    }
    .btn:hover {
      transform: scale(1.05);
      background: #f50057;
    }

    /* 아이스크림 공장 게임 화면 */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #e0f7fa 0%, #fff9c4 100%);
      overflow: hidden;
    }

    /* 공장 배경 데코레이션 */
    .conveyor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100px;
      background: #78909c;
      border-top: 8px solid #455a64;
    }
    .pipe {
      position: absolute;
      top: 0;
      width: 70px;
      height: 120px;
      background: #b0bec5;
      border: 4px solid #37474f;
      border-radius: 0 0 20px 20px;
    }
    .pipe-1 { left: 10%; }
    .pipe-2 { right: 10%; }

    /* 상단 HUD */
    #top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .hud-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Floating 아이스크림 객체 */
    .ice-cream {
      position: absolute;
      width: 100px;
      height: 120px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
      will-change: transform;
    }
    .scoop {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
      border: 4px solid #fff;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.15);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    .cone {
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 40px solid #d7ccc8;
      margin-top: -8px;
    }

    /* 축하 모달 */
    #congratulations-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 30px;
      text-align: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 1. 설정 및 시작 화면 -->
  <div id="start-screen">
    <div class="card">
      <h1>🍦 아이스크림 파닉스</h1>
      <div class="setting-group">
        <label for="accent-select">발음 선택</label>
        <select id="accent-select">
          <option value="en-US">미국식 (US)</option>
          <option value="en-GB">영국식 (UK)</option>
        </select>
      </div>
      <div class="setting-group">
        <label for="volume-slider">음량 조절</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8" />
      </div>
      <button class="btn" id="start-btn">공장 입장하기!</button>
    </div>
  </div>

  <!-- 2. 게임 화면 -->
  <div id="game-container">
    <div id="top-bar">
      <div class="hud-box">
        <span>완료: </span>
        <span id="progress-text" style="color: #ff4081;">0 / 26</span>
      </div>
      <div class="hud-box">
        <label for="in-game-volume" style="margin:0; font-size: 14px;">🔊 </label>
        <input type="range" id="in-game-volume" min="0" max="1" step="0.1" value="0.8" style="width: 80px;" />
      </div>
    </div>

    <!-- 배경 구조물 -->
    <div class="pipe pipe-1"></div>
    <div class="pipe pipe-2"></div>
    <div class="conveyor"></div>
  </div>

  <!-- 3. 결과 축하 모달 -->
  <div id="congratulations-modal">
    <div class="modal-content">
      <h2 style="font-size: 32px; color: #ff4081; margin-bottom: 15px;">🎉 축하해! 🎉</h2>
      <p style="font-size: 20px; color: #333; margin-bottom: 25px;">모든 알파벳을 익혔어!</p>
      <button class="btn" id="restart-btn">다시 시작하기 🔄</button>
    </div>
  </div>

  <script>
    // 알파벳 이름과 순수 발음 소리(Phonics Sound) 데이터 세트
    const PHONICS_DATA = [
      { upper: 'A', lower: 'a', soundText: 'A... ae' },
      { upper: 'B', lower: 'b', soundText: 'B... b' },
      { upper: 'C', lower: 'c', soundText: 'C... k' },
      { upper: 'D', lower: 'd', soundText: 'D... d' },
      { upper: 'E', lower: 'e', soundText: 'E... eh' },
      { upper: 'F', lower: 'f', soundText: 'F... f' },
      { upper: 'G', lower: 'g', soundText: 'G... g' },
      { upper: 'H', lower: 'h', soundText: 'H... h' },
      { upper: 'I', lower: 'i', soundText: 'I... ih' },
      { upper: 'J', lower: 'j', soundText: 'J... j' },
      { upper: 'K', lower: 'k', soundText: 'K... k' },
      { upper: 'L', lower: 'l', soundText: 'L... l' },
      { upper: 'M', lower: 'm', soundText: 'M... m' },
      { upper: 'N', lower: 'n', soundText: 'N... n' },
      { upper: 'O', lower: 'o', soundText: 'O... ah' },
      { upper: 'P', lower: 'p', soundText: 'P... p' },
      { upper: 'Q', lower: 'q', soundText: 'Q... kw' },
      { upper: 'R', lower: 'r', soundText: 'R... er' },
      { upper: 'S', lower: 's', soundText: 'S... s' },
      { upper: 'T', lower: 't', soundText: 'T... t' },
      { upper: 'U', lower: 'u', soundText: 'U... uh' },
      { upper: 'V', lower: 'v', soundText: 'V... v' },
      { upper: 'W', lower: 'w', soundText: 'W... w' },
      { upper: 'X', lower: 'x', soundText: 'X... ks' },
      { upper: 'Y', lower: 'y', soundText: 'Y... y' },
      { upper: 'Z', lower: 'z', soundText: 'Z... z' }
    ];

    const MAX_CONCURRENT = 5;
    const scoopColors = ['#ff80ab', '#ff4081', '#1de9b6', '#00e676', '#ffea00', '#ff9100', '#b388ff', '#40c4ff'];

    let queueIndex = 0;
    let completedCount = 0;
    let activeItems = [];
    let selectedAccent = 'en-US';
    let volume = 0.8;
    let animationFrameId = null;

    // DOM 요소
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('start-btn');
    const accentSelect = document.getElementById('accent-select');
    const volumeSlider = document.getElementById('volume-slider');
    const inGameVolume = document.getElementById('in-game-volume');
    const gameContainer = document.getElementById('game-container');
    const progressText = document.getElementById('progress-text');
    const congratsModal = document.getElementById('congratulations-modal');
    const restartBtn = document.getElementById('restart-btn');

    // SpeechSynthesis TTS
    const synth = window.speechSynthesis;

    function speakPhonics(text) {
      if (synth.speaking) synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = selectedAccent;
      utterance.volume = volume;
      utterance.rate = 0.8; // 정확한 음가 전달을 위해 적절한 속도 설정

      const voices = synth.getVoices();
      const preferredVoice = voices.find(v => v.lang === selectedAccent || v.lang.startsWith(selectedAccent.slice(0, 2)));
      if (preferredVoice) utterance.voice = preferredVoice;

      synth.speak(utterance);
    }

    function playFanfareSound() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [261.63, 329.63, 392.00, 523.25];
      
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = volume * 0.2;
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const startTime = audioCtx.currentTime + index * 0.12;
        osc.start(startTime);
        osc.stop(startTime + 0.25);
      });
    }

    startBtn.addEventListener('click', () => {
      selectedAccent = accentSelect.value;
      volume = parseFloat(volumeSlider.value);
      inGameVolume.value = volume;

      startScreen.style.display = 'none';
      initGame();
    });

    volumeSlider.addEventListener('input', (e) => { volume = parseFloat(e.target.value); });
    inGameVolume.addEventListener('input', (e) => { 
      volume = parseFloat(e.target.value); 
      volumeSlider.value = volume;
    });

    function initGame() {
      activeItems.forEach(item => item.el.remove());
      activeItems = [];
      queueIndex = 0;
      completedCount = 0;
      progressText.textContent = `0 / 26`;

      for (let i = 0; i < MAX_CONCURRENT; i++) {
        spawnNextIceCream(true);
      }

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animateLoop();
    }

    function spawnNextIceCream(isInitial = false) {
      if (queueIndex >= PHONICS_DATA.length) return;

      const data = PHONICS_DATA[queueIndex++];
      const el = document.createElement('div');
      el.className = 'ice-cream';
      
      const randomColor = scoopColors[Math.floor(Math.random() * scoopColors.length)];
      el.innerHTML = `
        <div class="scoop" style="background: ${randomColor}">${data.upper} ${data.lower}</div>
        <div class="cone"></div>
      `;

      gameContainer.appendChild(el);

      const margin = 120;
      const x = Math.random() * (window.innerWidth - margin) + 20;
      const y = isInitial ? window.innerHeight + Math.random() * 300 : window.innerHeight + 50;
      const speedY = 1.0 + Math.random() * 0.8;
      const waveFreq = 0.02 + Math.random() * 0.02;
      const waveAmp = 30 + Math.random() * 30;

      const itemObj = {
        el,
        data,
        x,
        y,
        speedY,
        wave: Math.random() * Math.PI * 2,
        waveFreq,
        waveAmp,
        clicked: false
      };

      el.addEventListener('click', () => {
        if (itemObj.clicked) return;
        itemObj.clicked = true;

        // 알파벳 이름과 순수 음가만 출력 (예: "A... ae")
        speakPhonics(data.soundText);

        el.style.transition = 'transform 0.2s, opacity 0.2s';
        el.style.transform += ' scale(1.3)';
        el.style.opacity = '0';

        completedCount++;
        progressText.textContent = `${completedCount} / 26`;

        setTimeout(() => {
          el.remove();
          activeItems = activeItems.filter(i => i !== itemObj);
          
          spawnNextIceCream();

          if (completedCount >= PHONICS_DATA.length) {
            showCongratulations();
          }
        }, 300);
      });

      activeItems.push(itemObj);
    }

    function animateLoop() {
      activeItems.forEach(item => {
        if (item.clicked) return;

        item.y -= item.speedY;
        item.wave += item.waveFreq;
        const currentX = item.x + Math.sin(item.wave) * item.waveAmp;

        item.el.style.transform = `translate(${currentX}px, ${item.y}px)`;

        if (item.y < -150) {
          item.y = window.innerHeight + 50;
          item.x = Math.random() * (window.innerWidth - 120) + 20;
        }
      });

      animationFrameId = requestAnimationFrame(animateLoop);
    }

    function showCongratulations() {
      congratsModal.style.display = 'flex';
      playFanfareSound();

      setTimeout(() => {
        speakPhonics("축하해! 모든 알파벳을 익혔어!");
      }, 300);

      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });
    }

    restartBtn.addEventListener('click', () => {
      congratsModal.style.display = 'none';
      initGame();
    });

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => synth.getVoices();
    }
  </script>
</body>
</html>
