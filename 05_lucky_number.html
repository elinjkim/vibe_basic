<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Magic Lucky Numbers</title>

<style>

/* =====================================================
   기본 설정
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        "Noto Sans KR",
        Arial,
        sans-serif;

    color: white;

    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 30%,
            #6651a8 0%,
            #30235f 35%,
            #15102f 75%,
            #090719 100%
        );
}


/* =====================================================
   마법의 배경
===================================================== */

.magic-background {
    position: fixed;
    inset: 0;

    pointer-events: none;

    overflow: hidden;
}


/* 커다란 마법의 빛 */

.magic-glow {
    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 35%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(210,190,255,0.25),
            rgba(130,100,220,0.08) 40%,
            transparent 70%
        );

    filter: blur(20px);
}


/* 작은 마법 입자 */

.magic-particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 8px #fff,
        0 0 16px #cdbbff;

    opacity: 0.5;

    animation:
        particleFloat 6s
        ease-in-out
        infinite;
}


@keyframes particleFloat {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);

        opacity: 0.25;
    }

    50% {
        transform:
            translateY(-35px)
            scale(1.5);

        opacity: 0.8;
    }
}


/* =====================================================
   게임
===================================================== */

.game {

    width: min(92%, 700px);

    text-align: center;

    position: relative;

    z-index: 5;
}


/* =====================================================
   제목
===================================================== */

.title {

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(30px, 6vw, 52px);

    font-weight: normal;

    letter-spacing:
        0.05em;

    text-shadow:
        0 0 15px
        rgba(220,200,255,0.8),

        0 0 40px
        rgba(150,120,255,0.4);

    margin-bottom: 10px;
}


.subtitle {

    font-size: 14px;

    color:
        rgba(255,255,255,0.65);

    letter-spacing:
        0.08em;

    margin-bottom: 35px;
}


/* =====================================================
   숫자 7개 영역
===================================================== */

.numbers {

    display: flex;

    justify-content: center;

    align-items: center;

    flex-wrap: wrap;

    gap: 14px;

    min-height: 95px;

    margin-bottom: 30px;
}


/* =====================================================
   숫자 공
===================================================== */

.number-ball {

    width: 72px;
    height: 72px;

    border-radius: 50%;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 24px;

    font-weight: 700;

    color: #49377c;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #dcd2ff
        );

    box-shadow:
        0 0 20px
        rgba(220,205,255,0.35),

        0 10px 25px
        rgba(0,0,0,0.35);

    opacity: 0.18;

    transform:
        scale(0.7);

    transition:
        opacity 0.4s ease;
}


/* =====================================================
   숫자가 등장할 때
===================================================== */

.number-ball.reveal {

    opacity: 1;

    animation:
        magicalReveal
        1s
        cubic-bezier(.17,.67,.35,1.4);
}


@keyframes magicalReveal {

    0% {

        transform:
            scale(0)
            rotate(-180deg);

        filter:
            blur(12px);

        box-shadow:
            0 0 0
            rgba(255,255,255,0);
    }


    40% {

        transform:
            scale(1.3)
            rotate(20deg);

        filter:
            blur(0);

        box-shadow:
            0 0 45px
            rgba(255,255,255,0.9),

            0 0 90px
            rgba(190,160,255,0.7);
    }


    65% {

        transform:
            scale(0.9)
            rotate(-8deg);
    }


    82% {

        transform:
            scale(1.08)
            rotate(4deg);
    }


    100% {

        transform:
            scale(1)
            rotate(0);
    }
}


/* =====================================================
   행운의 멘트
===================================================== */

.lucky-message {

    min-height: 30px;

    margin-bottom: 30px;

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(14px, 2vw, 18px);

    font-style: italic;

    letter-spacing:
        0.05em;

    color:
        rgba(255,245,255,0.9);

    text-shadow:
        0 0 12px
        rgba(210,190,255,0.6);

    opacity: 0;

    transition:
        opacity 0.5s ease;
}


.lucky-message.show {

    opacity: 1;
}


/* =====================================================
   버튼
===================================================== */

.draw-button {

    border: none;

    padding:
        16px 38px;

    border-radius: 50px;

    cursor: pointer;

    font-size: 16px;

    font-weight: 700;

    color: white;

    background:
        linear-gradient(
            135deg,
            #8064dc,
            #b66bea
        );

    box-shadow:
        0 8px 30px
        rgba(130,90,230,0.45),

        inset 0 1px 1px
        rgba(255,255,255,0.35);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.draw-button:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 40px
        rgba(160,120,255,0.65);
}


.draw-button:active {

    transform:
        scale(0.96);
}


/* 버튼이 추첨 중일 때 */

.draw-button.disabled {

    opacity: 0.5;

    cursor: not-allowed;

    pointer-events: none;
}


/* =====================================================
   반짝임
===================================================== */

.sparkle {

    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 20px #d7c6ff;

    pointer-events: none;

    animation:
        sparkleMagic
        1s
        ease-out
        forwards;
}


@keyframes sparkleMagic {

    0% {

        opacity: 0;

        transform:
            scale(0);
    }

    30% {

        opacity: 1;

        transform:
            scale(1.8);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);
    }
}


/* =====================================================
   모바일
===================================================== */

@media (max-width: 600px) {

    .numbers {

        gap: 9px;
    }

    .number-ball {

        width: 58px;
        height: 58px;

        font-size: 20px;
    }

    .title {

        font-size: 31px;
    }

}

</style>
</head>


<body>


<!-- ===================================================
     마법 배경
==================================================== -->

<div class="magic-background">

    <div class="magic-glow"></div>

    <div
        class="magic-particle"
        style="left:10%; top:20%;"
    ></div>

    <div
        class="magic-particle"
        style="left:25%; top:70%; animation-delay:1s;"
    ></div>

    <div
        class="magic-particle"
        style="left:75%; top:25%; animation-delay:2s;"
    ></div>

    <div
        class="magic-particle"
        style="left:90%; top:65%; animation-delay:3s;"
    ></div>

    <div
        class="magic-particle"
        style="left:55%; top:15%; animation-delay:1.5s;"
    ></div>

</div>


<!-- ===================================================
     게임
==================================================== -->

<main class="game">


    <h1 class="title">
        ✦ Magic Lucky Numbers ✦
    </h1>


    <p class="subtitle">
        1부터 100까지, 오늘의 행운을 찾아보세요
    </p>


    <!-- 숫자 7개 -->

    <div
        class="numbers"
        id="numbers"
    >

        <!-- JavaScript가 자동으로 생성 -->

    </div>


    <!-- 행운의 멘트 -->

    <div
        class="lucky-message"
        id="luckyMessage"
    ></div>


    <!-- 버튼 -->

    <button
        class="draw-button"
        id="drawButton"
    >
        🔮 행운의 숫자 뽑기
    </button>


</main>


<script>


/* =====================================================
   요소 가져오기
===================================================== */

const numbersContainer =
    document.getElementById(
        "numbers"
    );


const drawButton =
    document.getElementById(
        "drawButton"
    );


const luckyMessage =
    document.getElementById(
        "luckyMessage"
    );


/* =====================================================
   행운의 멘트 목록
===================================================== */

const luckyMessages = [

    "오늘의 작은 선택이 멋진 행운으로 이어질 거예요.",

    "당신에게 좋은 일이 조용히 다가오고 있어요.",

    "우연처럼 보이는 순간에도 행운은 숨어 있답니다.",

    "오늘은 평소보다 조금 더 과감해도 좋은 날이에요.",

    "당신이 고른 숫자에 특별한 의미가 깃들었어요.",

    "기다리던 좋은 소식이 찾아올지도 몰라요.",

    "오늘의 당신에게는 반짝이는 운이 함께하고 있어요.",

    "작은 행운 하나가 하루 전체를 바꿀 수 있어요.",

    "마음이 이끄는 곳에 뜻밖의 기회가 기다리고 있어요.",

    "오늘은 우연을 믿어봐도 좋은 날이에요.",

    "당신의 하루에 따뜻한 행운이 피어나고 있어요.",

    "지금 이 순간, 좋은 기운이 당신 곁에 머물고 있어요."

];


/* =====================================================
   Web Audio
===================================================== */

let audioContext = null;


/* =====================================================
   오디오 시작
===================================================== */

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


/* =====================================================
   숫자가 나타날 때 마법 효과음
===================================================== */

function playMagicSound() {

    if (!audioContext) return;


    const now =
        audioContext.currentTime;


    /*
       첫 번째 음
    */

    const oscillator1 =
        audioContext.createOscillator();


    const gain1 =
        audioContext.createGain();


    oscillator1.type =
        "sine";


    oscillator1.frequency.setValueAtTime(
        500,
        now
    );


    oscillator1.frequency.exponentialRampToValueAtTime(
        1200,
        now + 0.25
    );


    oscillator1.frequency.exponentialRampToValueAtTime(
        1800,
        now + 0.55
    );


    gain1.gain.setValueAtTime(
        0.0001,
        now
    );


    gain1.gain.exponentialRampToValueAtTime(
        0.12,
        now + 0.03
    );


    gain1.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.8
    );


    oscillator1.connect(gain1);

    gain1.connect(
        audioContext.destination
    );


    oscillator1.start(now);

    oscillator1.stop(
        now + 0.8
    );


    /*
       반짝이는 고음
    */

    const oscillator2 =
        audioContext.createOscillator();


    const gain2 =
        audioContext.createGain();


    oscillator2.type =
        "sine";


    oscillator2.frequency.value =
        2400;


    gain2.gain.setValueAtTime(
        0.0001,
        now + 0.18
    );


    gain2.gain.exponentialRampToValueAtTime(
        0.05,
        now + 0.2
    );


    gain2.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.7
    );


    oscillator2.connect(gain2);

    gain2.connect(
        audioContext.destination
    );


    oscillator2.start(
        now + 0.18
    );

    oscillator2.stop(
        now + 0.7
    );

}


/* =====================================================
   1~100 중 랜덤 숫자
===================================================== */

function getRandomNumber() {

    return Math.floor(
        Math.random() * 100
    ) + 1;

}


/* =====================================================
   중복 없는 7개 숫자 만들기
===================================================== */

function createLuckyNumbers() {

    const numbers = [];


    while (
        numbers.length < 7
    ) {

        const number =
            getRandomNumber();


        /*
           이미 뽑힌 숫자가 아니라면 추가
        */

        if (
            !numbers.includes(number)
        ) {

            numbers.push(number);

        }

    }


    return numbers;

}


/* =====================================================
   숫자 공 만들기
===================================================== */

function createNumberBalls() {

    numbersContainer.innerHTML = "";


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const ball =
            document.createElement(
                "div"
            );


        ball.className =
            "number-ball";


        ball.textContent =
            "?";


        numbersContainer.appendChild(
            ball
        );

    }

}


/* =====================================================
   반짝임 생성
===================================================== */

function createSparkles(ball) {

    const rect =
        ball.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const sparkle =
            document.createElement(
                "div"
            );


        sparkle.className =
            "sparkle";


        sparkle.style.position =
            "fixed";


        sparkle.style.left =
            centerX + "px";


        sparkle.style.top =
            centerY + "px";


        sparkle.style.setProperty(
            "--x",
            `${(Math.random() - 0.5) * 140}px`
        );


        sparkle.style.setProperty(
            "--y",
            `${(Math.random() - 0.5) * 140}px`
        );


        const size =
            3 +
            Math.random() * 6;


        sparkle.style.width =
            size + "px";


        sparkle.style.height =
            size + "px";


        document.body.appendChild(
            sparkle
        );


        setTimeout(
            () => sparkle.remove(),
            1100
        );

    }

}


/* =====================================================
   행운의 멘트 변경
===================================================== */

function showLuckyMessage() {

    const randomIndex =
        Math.floor(
            Math.random() *
            luckyMessages.length
        );


    luckyMessage.classList.remove(
        "show"
    );


    setTimeout(
        () => {

            luckyMessage.textContent =
                luckyMessages[
                    randomIndex
                ];


            luckyMessage.classList.add(
                "show"
            );

        },
        150
    );

}


/* =====================================================
   숫자 색상
===================================================== */

function setBallColor(
    ball,
    number
) {

    if (number <= 20) {

        ball.style.background =
            "linear-gradient(145deg,#fff7c7,#ffd86b)";

        ball.style.color =
            "#795b00";

    }

    else if (number <= 40) {

        ball.style.background =
            "linear-gradient(145deg,#ffdce3,#ff9bae)";

        ball.style.color =
            "#96354c";

    }

    else if (number <= 60) {

        ball.style.background =
            "linear-gradient(145deg,#d7f3ff,#78cfff)";

        ball.style.color =
            "#216384";

    }

    else if (number <= 80) {

        ball.style.background =
            "linear-gradient(145deg,#e3d9ff,#aa91ff)";

        ball.style.color =
            "#553e9a";

    }

    else {

        ball.style.background =
            "linear-gradient(145deg,#ffe1c7,#ffb071)";

        ball.style.color =
            "#994e20";

    }

}


/* =====================================================
   ★ 행운 숫자 뽑기
===================================================== */

drawButton.addEventListener(
    "click",
    async () => {


        /*
           브라우저에서
           오디오 사용 허용
        */

        initAudio();


        /*
           버튼 잠금
        */

        drawButton.classList.add(
            "disabled"
        );


        /*
           기존 숫자 초기화
        */

        createNumberBalls();


        /*
           행운의 멘트 초기화
        */

        luckyMessage.classList.remove(
            "show"
        );


        /*
           1~100 중
           중복 없는 7개 숫자 생성
        */

        const luckyNumbers =
            createLuckyNumbers();


        /*
           7개를 하나씩 등장시킴
        */

        const balls =
            document.querySelectorAll(
                ".number-ball"
            );


        for (
            let i = 0;
            i < 7;
            i++
        ) {


            /*
               잠깐 기다린 후 등장
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        550
                    )
            );


            const number =
                luckyNumbers[i];


            const ball =
                balls[i];


            /*
               숫자 표시
            */

            ball.textContent =
                number;


            /*
               숫자별 색상
            */

            setBallColor(
                ball,
                number
            );


            /*
               등장 애니메이션
            */

            ball.classList.add(
                "reveal"
            );


            /*
               마법 반짝임
            */

            createSparkles(
                ball
            );


            /*
               마법 효과음
            */

            playMagicSound();

        }

 	    /*
               숫자에 맞춰
               행운의 멘트도 변경
            */

            showLuckyMessage();


        /*
           모든 숫자가 나온 후
           버튼 다시 활성화
        */

        setTimeout(
            () => {

                drawButton.classList.remove(
                    "disabled"
                );

            },
            500
        );

    }
);


/* =====================================================
   처음 화면에 ? 7개 만들기
===================================================== */

createNumberBalls();

</script>

</body>
</html>
