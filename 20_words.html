<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📚 나만의 영어 단어장</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff8dc,
            #e9f7ff
        );

    color: #333;
}


/* =========================================
   전체
========================================= */

.container {

    width: min(1100px, 94%);

    margin: 25px auto 50px;
}


/* =========================================
   헤더
========================================= */

.header {

    background: white;

    border-radius: 24px;

    padding: 20px;

    margin-bottom: 15px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);

    text-align: center;
}

.header h1 {

    margin: 0 0 7px;

    font-size: 36px;

    color: #5367c8;
}

.header p {

    margin: 0;

    color: #777;

    font-size: 15px;
}


/* =========================================
   설정
========================================= */

.settings {

    background: white;

    border-radius: 18px;

    padding: 14px 18px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.06);

    flex-wrap: wrap;
}

.settings-title {

    font-weight: bold;

    font-size: 16px;
}

.pronunciation {

    display: flex;

    gap: 8px;
}

.pronunciation button {

    border: 2px solid #ccd2f5;

    background: white;

    color: #5367c8;

    padding: 8px 14px;

    border-radius: 10px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.pronunciation button:hover {

    transform: translateY(-2px);
}

.pronunciation button.active {

    background: #667eea;

    border-color: #667eea;

    color: white;
}


/* =========================================
   단어 입력
========================================= */

.input-box {

    background: white;

    border-radius: 20px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);
}

.input-row {

    display: flex;

    gap: 10px;
}

#wordInput {

    flex: 1;

    padding: 14px 16px;

    font-size: 18px;

    border:
        3px solid #dce2ff;

    border-radius: 12px;

    outline: none;
}

#wordInput:focus {

    border-color: #667eea;
}

#addWordBtn {

    border: none;

    border-radius: 12px;

    padding: 0 23px;

    background: #667eea;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

#addWordBtn:hover {

    background: #5368d0;
}


/* =========================================
   통계
========================================= */

.stats {

    display: flex;

    gap: 10px;

    margin-bottom: 15px;
}

.stat {

    flex: 1;

    background: white;

    padding: 13px;

    text-align: center;

    border-radius: 15px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.06);
}

.stat-number {

    display: block;

    font-size: 25px;

    font-weight: bold;

    color: #667eea;
}

.stat-label {

    font-size: 13px;

    color: #777;
}


/* =========================================
   검색
========================================= */

.toolbar {

    display: flex;

    gap: 8px;

    margin-bottom: 12px;

    flex-wrap: wrap;
}

#searchInput {

    flex: 1;

    min-width: 180px;

    padding: 11px 14px;

    border:
        2px solid #ddd;

    border-radius: 10px;

    font-size: 15px;
}

.filter-btn {

    border:
        2px solid #667eea;

    background: white;

    color: #667eea;

    border-radius: 10px;

    padding: 8px 13px;

    cursor: pointer;

    font-weight: bold;
}

.filter-btn.active {

    background: #667eea;

    color: white;
}


/* =========================================
   단어장
========================================= */

.book {

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.08);
}

table {

    width: 100%;

    border-collapse: collapse;
}

thead {

    background: #667eea;

    color: white;
}

th {

    padding: 14px 9px;

    font-size: 14px;
}

td {

    padding: 14px 9px;

    border-bottom:
        1px solid #eee;

    vertical-align: middle;
}

tbody tr:hover {

    background: #fafbff;
}


/* =========================================
   암기 체크
========================================= */

.check-btn {

    width: 36px;

    height: 36px;

    border-radius: 50%;

    border:
        2px solid #ccc;

    background: white;

    cursor: pointer;

    font-size: 18px;

    transition: .2s;
}

.check-btn:hover {

    transform: scale(1.08);
}

.check-btn.checked {

    background: #6bd36b;

    border-color: #50b850;

    color: white;
}


/* =========================================
   단어
========================================= */

.word-button {

    border: none;

    background: none;

    color: #4054aa;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    text-align: left;
}

.word-button:hover {

    text-decoration: underline;
}

.speaker {

    font-size: 15px;

    margin-left: 4px;
}


/* =========================================
   예문
========================================= */

.example-button {

    border: none;

    background: transparent;

    text-align: left;

    color: #555;

    line-height: 1.5;

    cursor: pointer;

    font-size: 14px;

    padding: 0;
}

.example-button:hover {

    color: #5367c8;

    text-decoration: underline;
}

.example-speaker {

    margin-left: 5px;
}


/* =========================================
   난이도
========================================= */

.level {

    display: inline-block;

    padding: 4px 8px;

    border-radius: 8px;

    font-size: 11px;

    font-weight: bold;
}

.level.easy {

    background: #e2f7df;

    color: #398c36;
}

.level.middle {

    background: #fff0cc;

    color: #a56a00;
}


/* =========================================
   삭제
========================================= */

.delete-btn {

    border: none;

    background: #ffe6e6;

    color: #e05252;

    border-radius: 8px;

    padding: 7px 9px;

    cursor: pointer;
}


/* =========================================
   빈 화면
========================================= */

.empty {

    padding: 50px 20px;

    text-align: center;

    color: #888;
}

.empty-icon {

    font-size: 50px;

    margin-bottom: 10px;
}


/* =========================================
   발음 안내
========================================= */

.voice-info {

    text-align: center;

    color: #888;

    font-size: 12px;

    margin-top: 12px;
}


/* =========================================
   모바일
========================================= */

@media(max-width:700px) {

    .container {

        width: 96%;

        margin-top: 12px;
    }

    .header h1 {

        font-size: 27px;
    }

    .input-row {

        flex-direction: column;
    }

    #addWordBtn {

        height: 48px;
    }

    .settings {

        justify-content: center;

        text-align: center;
    }

    .settings-title {

        width: 100%;
    }

    .pronunciation {

        width: 100%;

        justify-content: center;
    }

    .stats {

        gap: 5px;
    }

    .stat {

        padding: 10px 4px;
    }

    .book {

        overflow-x: auto;
    }

    table {

        min-width: 780px;
    }
}

</style>
</head>


<body>


<div class="container">


    <!-- =====================================
         제목
    ====================================== -->

    <div class="header">

        <h1>
            📚 나만의 영어 단어장
        </h1>

        <p>
            단어를 듣고, 예문을 읽고, 하나씩 외워보세요!
        </p>

    </div>


    <!-- =====================================
         발음 설정
    ====================================== -->

    <div class="settings">

        <div class="settings-title">

            ⚙️ 영어 발음 설정

        </div>


        <div class="pronunciation">

            <button
                id="americanBtn"
                class="active">

                🇺🇸 미국식

            </button>


            <button
                id="britishBtn">

                🇬🇧 영국식

            </button>

        </div>


        <div class="voice-info">

            단어 또는 🔊 예문을 눌러보세요!

        </div>

    </div>


    <!-- =====================================
         단어 입력
    ====================================== -->

    <div class="input-box">

        <div class="input-row">

            <input
                id="wordInput"
                type="text"
                placeholder="영어 단어를 입력하세요. 예: curious"
                autocomplete="off"
            >


            <button id="addWordBtn">

                ➕ 단어 추가

            </button>

        </div>

    </div>


    <!-- =====================================
         통계
    ====================================== -->

    <div class="stats">


        <div class="stat">

            <span
                class="stat-number"
                id="totalCount">

                0

            </span>

            <span class="stat-label">

                전체 단어

            </span>

        </div>


        <div class="stat">

            <span
                class="stat-number"
                id="learnedCount">

                0

            </span>

            <span class="stat-label">

                외운 단어

            </span>

        </div>


        <div class="stat">

            <span
                class="stat-number"
                id="remainCount">

                0

            </span>

            <span class="stat-label">

                남은 단어

            </span>

        </div>


    </div>


    <!-- =====================================
         검색 / 필터
    ====================================== -->

    <div class="toolbar">


        <input
            id="searchInput"
            type="text"
            placeholder="🔍 단어 또는 뜻 검색"
        >


        <button
            class="filter-btn active"
            id="allBtn">

            전체

        </button>


        <button
            class="filter-btn"
            id="unlearnedBtn">

            📖 암기 중

        </button>


        <button
            class="filter-btn"
            id="learnedBtn">

            ✅ 외운 단어

        </button>


    </div>


    <!-- =====================================
         단어표
    ====================================== -->

    <div class="book">

        <table>

            <thead>

                <tr>

                    <!-- 암기 체크를 맨 앞으로 -->

                    <th>
                        암기
                    </th>

                    <th>
                        단어
                    </th>

                    <th>
                        뜻
                    </th>

                    <th>
                        예문 🔊
                    </th>

                    <th>
                        난이도
                    </th>

                    <th>
                        삭제
                    </th>

                </tr>

            </thead>


            <tbody
                id="wordTable">

            </tbody>

        </table>

    </div>


</div>



<script>


/* =========================================================
   기본 단어 데이터

   초등 고학년 ~ 중학생 수준
========================================================= */

const wordData = {

    apple: {

        meaning: "사과",

        example:
            "I eat an apple every morning.",

        level: "초급"

    },


    brave: {

        meaning: "용감한",

        example:
            "The brave boy helped his friend.",

        level: "초급"

    },


    beautiful: {

        meaning: "아름다운",

        example:
            "The flowers are beautiful.",

        level: "초급"

    },


    careful: {

        meaning: "조심성 있는",

        example:
            "Be careful when you cross the street.",

        level: "초급"

    },


    clever: {

        meaning: "영리한",

        example:
            "She is a clever student.",

        level: "초급"

    },


    curious: {

        meaning: "호기심이 많은",

        example:
            "My little brother is very curious.",

        level: "중급"

    },


    discover: {

        meaning: "발견하다",

        example:
            "We discovered a beautiful place.",

        level: "중급"

    },


    important: {

        meaning: "중요한",

        example:
            "Sleep is important for your health.",

        level: "초급"

    },


    improve: {

        meaning: "향상시키다",

        example:
            "I want to improve my English.",

        level: "중급"

    },


    imagine: {

        meaning: "상상하다",

        example:
            "Can you imagine living on Mars?",

        level: "중급"

    },


    journey: {

        meaning: "여행, 여정",

        example:
            "Our journey was long but exciting.",

        level: "중급"

    },


    mistake: {

        meaning: "실수",

        example:
            "Making a mistake is okay.",

        level: "초급"

    },


    protect: {

        meaning: "보호하다",

        example:
            "We should protect our planet.",

        level: "중급"

    },


    remember: {

        meaning: "기억하다",

        example:
            "Please remember my name.",

        level: "초급"

    },


    surprise: {

        meaning: "놀라게 하다, 놀라움",

        example:
            "The party was a big surprise.",

        level: "초급"

    },


    wonderful: {

        meaning: "멋진, 훌륭한",

        example:
            "We had a wonderful day.",

        level: "초급"

    }

};


/* =========================================================
   단어 저장
========================================================= */

let words =

    JSON.parse(
        localStorage.getItem(
            "myEnglishWords"
        )
    ) || [];


/* =========================================================
   발음 설정 저장

   기본값 = 미국식
========================================================= */

let pronunciation =

    localStorage.getItem(
        "englishPronunciation"
    ) || "US";


/* =========================================================
   현재 필터
========================================================= */

let currentFilter = "all";


/* =========================================================
   DOM
========================================================= */

const wordInput =
    document.getElementById(
        "wordInput"
    );

const table =
    document.getElementById(
        "wordTable"
    );


/* =========================================================
   저장
========================================================= */

function saveWords() {

    localStorage.setItem(
        "myEnglishWords",
        JSON.stringify(words)
    );

}


/* =========================================================
   발음 설정 저장
========================================================= */

function savePronunciation() {

    localStorage.setItem(
        "englishPronunciation",
        pronunciation
    );

}


/* =========================================================
   발음 버튼 화면 표시
========================================================= */

function updatePronunciationButtons() {

    const american =
        document.getElementById(
            "americanBtn"
        );

    const british =
        document.getElementById(
            "britishBtn"
        );


    american.classList.remove(
        "active"
    );

    british.classList.remove(
        "active"
    );


    if (
        pronunciation === "US"
    ) {

        american.classList.add(
            "active"
        );

    } else {

        british.classList.add(
            "active"
        );

    }

}


/* =========================================================
   발음 설정 버튼
========================================================= */

document
.getElementById(
    "americanBtn"
)
.addEventListener(
    "click",
    function() {

        pronunciation = "US";

        savePronunciation();

        updatePronunciationButtons();

    }
);


document
.getElementById(
    "britishBtn"
)
.addEventListener(
    "click",
    function() {

        pronunciation = "UK";

        savePronunciation();

        updatePronunciationButtons();

    }
);


/* =========================================================
   음성 읽기
========================================================= */

function speak(
    text,
    isSentence = false
) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "이 브라우저에서는 음성 기능을 지원하지 않아요."
        );

        return;

    }


    /*
        현재 읽고 있는 음성 중지
    */

    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
        미국식 / 영국식
    */

    if (
        pronunciation === "UK"
    ) {

        utterance.lang =
            "en-GB";

    } else {

        utterance.lang =
            "en-US";

    }


    /*
        아이들이 듣기 편한 속도
    */

    utterance.rate =
        isSentence
        ? 0.82
        : 0.72;


    utterance.pitch =
        1;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   단어 발음
========================================================= */

function speakWord(word) {

    speak(
        word,
        false
    );

}


/* =========================================================
   예문 읽기
========================================================= */

function speakExample(example) {

    speak(
        example,
        true
    );

}


/* =========================================================
   단어 추가
========================================================= */

function addWord() {

    const word =
        wordInput.value
        .trim()
        .toLowerCase();


    if (!word) {

        alert(
            "영어 단어를 입력해주세요! 😊"
        );

        wordInput.focus();

        return;

    }


    /*
        중복 확인
    */

    const exists =
        words.some(
            item =>
                item.word === word
        );


    if (exists) {

        alert(
            "이미 단어장에 있는 단어예요! 📚"
        );

        wordInput.select();

        return;

    }


    /*
        기본 단어 데이터 확인
    */

    let data =
        wordData[word];


    /*
        모르는 단어라면
        기본 예문 생성
    */

    if (!data) {

        data = {

            meaning:
                "뜻을 입력해주세요",

            example:
                `I learned the word "${word}" today.`,

            level:
                "초급"

        };

    }


    /*
        단어 저장
    */

    words.push({

        id:
            Date.now(),

        word:
            word,

        meaning:
            data.meaning,

        example:
            data.example,

        level:
            data.level,

        learned:
            false

    });


    saveWords();


    wordInput.value = "";

    wordInput.focus();


    render();

}


/* =========================================================
   단어 삭제
========================================================= */

function deleteWord(id) {

    const answer =
        confirm(
            "이 단어를 삭제할까요?"
        );


    if (!answer) {

        return;

    }


    words =
        words.filter(
            item =>
                item.id !== id
        );


    saveWords();

    render();

}


/* =========================================================
   암기 체크
========================================================= */

function toggleLearned(id) {

    const item =
        words.find(
            word =>
                word.id === id
        );


    if (!item) {

        return;

    }


    item.learned =
        !item.learned;


    saveWords();

    render();

}


/* =========================================================
   화면 그리기
========================================================= */

function render() {

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    let filtered =
        words.filter(
            item => {

                /*
                    검색어
                */

                const matchesSearch =

                    item.word
                    .toLowerCase()
                    .includes(search)

                    ||

                    item.meaning
                    .toLowerCase()
                    .includes(search);


                if (
                    !matchesSearch
                ) {

                    return false;

                }


                /*
                    필터
                */

                if (
                    currentFilter ===
                    "learned"
                ) {

                    return item.learned;

                }


                if (
                    currentFilter ===
                    "unlearned"
                ) {

                    return !item.learned;

                }


                return true;

            }
        );


    table.innerHTML = "";


    /*
        단어가 없을 때
    */

    if (
        filtered.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    <div class="empty-icon">
                        📖
                    </div>

                    <div>
                        아직 단어가 없어요.<br>
                        위에서 영어 단어를 추가해보세요!
                    </div>

                </td>

            </tr>

        `;

    }


    /*
        단어 표시
    */

    filtered.forEach(
        item => {

            const row =
                document.createElement(
                    "tr"
                );


            const levelClass =
                item.level === "중급"
                ? "middle"
                : "easy";


            /*
                HTML 작성
            */

            row.innerHTML = `

                <!-- 암기 체크 : 맨 앞 -->

                <td>

                    <button
                        class="check-btn ${
                            item.learned
                            ? "checked"
                            : ""
                        }"
                        onclick="
                            toggleLearned(
                                ${item.id}
                            )
                        ">

                        ${
                            item.learned
                            ? "✓"
                            : ""
                        }

                    </button>

                </td>


                <!-- 단어 -->

                <td>

                    <button
                        class="word-button"
                        onclick="
                            speakWord(
                                '${escapeHTML(item.word)}'
                            )
                        ">

                        ${escapeHTML(item.word)}

                        <span class="speaker">
                            🔊
                        </span>

                    </button>

                </td>


                <!-- 뜻 -->

                <td>

                    ${escapeHTML(
                        item.meaning
                    )}

                </td>


                <!-- 예문 -->

                <td>

                    <button
                        class="example-button"
                        onclick="
                            speakExample(
                                '${escapeHTML(item.example)}'
                            )
                        ">

                        ${escapeHTML(
                            item.example
                        )}

                        <span
                            class="example-speaker">

                            🔊

                        </span>

                    </button>

                </td>


                <!-- 난이도 -->

                <td>

                    <span
                        class="level ${levelClass}">

                        ${escapeHTML(
                            item.level
                        )}

                    </span>

                </td>


                <!-- 삭제 -->

                <td>

                    <button
                        class="delete-btn"
                        onclick="
                            deleteWord(
                                ${item.id}
                            )
                        ">

                        🗑️

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );


    updateStats();

}


/* =========================================================
   통계
========================================================= */

function updateStats() {

    const total =
        words.length;


    const learned =
        words.filter(
            item =>
                item.learned
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        total;


    document.getElementById(
        "learnedCount"
    ).textContent =
        learned;


    document.getElementById(
        "remainCount"
    ).textContent =
        total - learned;

}


/* =========================================================
   검색
========================================================= */

document
.getElementById(
    "searchInput"
)
.addEventListener(
    "input",
    render
);


/* =========================================================
   단어 입력 Enter
========================================================= */

wordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            addWord();

        }

    }
);


/* =========================================================
   단어 추가
========================================================= */

document
.getElementById(
    "addWordBtn"
)
.addEventListener(
    "click",
    addWord
);


/* =========================================================
   필터
========================================================= */

function setFilter(
    filter,
    buttonId
) {

    currentFilter =
        filter;


    document
    .querySelectorAll(
        ".filter-btn"
    )
    .forEach(
        button => {

            button.classList.remove(
                "active"
            );

        }
    );


    document
    .getElementById(
        buttonId
    )
    .classList.add(
        "active"
    );


    render();

}


document
.getElementById(
    "allBtn"
)
.addEventListener(
    "click",
    function() {

        setFilter(
            "all",
            "allBtn"
        );

    }
);


document
.getElementById(
    "unlearnedBtn"
)
.addEventListener(
    "click",
    function() {

        setFilter(
            "unlearned",
            "unlearnedBtn"
        );

    }
);


document
.getElementById(
    "learnedBtn"
)
.addEventListener(
    "click",
    function() {

        setFilter(
            "learned",
            "learnedBtn"
        );

    }
);


/* =========================================================
   HTML 문자 보호
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   초기 실행
========================================================= */

updatePronunciationButtons();

render();

</script>
